<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECE8DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lớp tiếng Trung">
<title>Lớp học · Guangyu Hanyu</title>
<link rel="icon" href="logo.webp">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--nen:#ECE8DF;--giay:rgba(255,255,255,.82);--muc:#2D4257;--nhat:#7B8EA3;--chinh:#5F8DB8;--chinh-dam:#3E6A93;--vien:#C9D9E8;
  --p1:#D7E8F6;--p1c:#3E6A93;--p2:#D6EEE4;--p2c:#3D7A62;--p3:#F8E2D6;--p3c:#A85F3C;--p4:#E5E0F5;--p4c:#6A5AA8;--hang:#F4F8FB;--do:#C0392B}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Noto Serif','Songti SC','STSong',serif;color:var(--muc);background:var(--nen);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:url(nen.jpg) center top/cover no-repeat}
@media (min-width:761px){body::before{left:auto;width:66.7vh;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 40%);mask-image:linear-gradient(to right,transparent 0,#000 40%)}}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--chinh-dam)}
.khung{max-width:1080px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}
.mo{color:var(--nhat)}.nho{font-size:13px}.an{display:none!important}
.mat{background:var(--giay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--vien)}
/* đầu trang */
.dau{border-radius:22px;padding:16px 22px}
.dau-tren{display:flex;align-items:center;gap:14px}
.dau img{width:54px;height:54px;border-radius:9px;flex:none}
.dau .ten small{display:block;font-size:11px;letter-spacing:.25em;color:var(--nhat)}
.dau .ten b{display:block;font-size:21px;letter-spacing:.03em;line-height:1.3}
.ve-chu{cursor:pointer;margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--vien);background:#fff;border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--chinh-dam);text-decoration:none;white-space:nowrap}
.ve-chu:hover{background:var(--p1)}
.mo-ct{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;border:1px solid var(--vien);background:var(--p1);color:var(--p1c);border-radius:14px;padding:10px 14px;font-size:14px;text-align:left;cursor:pointer}
.mo-ct .mui{margin-left:auto;font-weight:700;white-space:nowrap}
.mo-ct .mui i{display:inline-block;font-style:normal;transition:transform .25s}
.dau.mo .mo-ct .mui i{transform:rotate(180deg)}
.ct-lop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.dau.mo .ct-lop{grid-template-rows:1fr}
.ct-lop>div{overflow:hidden}
.ct-trong{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:14px}
h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--nhat)}
.hv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid var(--vien);margin-bottom:6px}
.hv .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.hv b{font-size:14.5px}.hv .tt{margin-left:auto}
.ttl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;font-size:14px;background:#fff;border:1px solid var(--vien);border-radius:12px;padding:12px 14px}
.ttl dt{color:var(--nhat)}.ttl dd{margin:0;font-weight:600}
/* tab */
.tab{position:sticky;top:8px;z-index:5;display:flex;gap:6px;margin:14px 0;border-radius:99px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tab button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:99px;padding:9px 14px;font-size:14.5px;color:var(--nhat);cursor:pointer;position:relative}
.tab button.on{background:var(--chinh);color:#fff;font-weight:700;box-shadow:0 6px 14px -6px var(--chinh)}
.tab i{font-style:normal}
.dem{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:99px;background:#E07A5F;color:#fff;font-size:11px;font-weight:700;font-style:normal;margin-left:4px;padding:0 5px}
.trang{display:none}.trang.on{display:block;animation:hien .35s ease}
@keyframes hien{from{opacity:0;transform:translateY(6px)}}
.the{border-radius:20px;padding:20px 22px;margin-bottom:14px}
h2{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .phu{margin-left:auto;font-size:13px;font-weight:400;color:var(--nhat)}
.bam{cursor:pointer}
/* ô số */
.o4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.o{border-radius:18px;padding:16px 16px 14px;position:relative;overflow:hidden;transition:transform .2s}
.o:hover{transform:translateY(-3px)}
.o span{font-size:12.5px;letter-spacing:.05em;opacity:.85}
.o b{display:block;font-size:28px;line-height:1.15;margin:4px 0 2px}
.o small{font-size:12.5px;opacity:.85}
.o.p1{background:var(--p1);color:var(--p1c)}.o.p2{background:var(--p2);color:var(--p2c)}.o.p3{background:var(--p3);color:var(--p3c)}.o.p4{background:var(--p4);color:var(--p4c)}
.o.no{background:#FBE3DF;color:#A8432F}
.o .vach{height:7px;border-radius:9px;background:rgba(255,255,255,.7);margin-top:8px;overflow:hidden}.o .vach i{display:block;height:100%;background:currentColor;border-radius:9px}
.o .bieu{position:absolute;right:12px;top:10px;font-size:26px;opacity:.55;font-style:normal}
.hai{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.nhac{border:1px dashed #E2B48F;background:#FDF3EA;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--vien);background:#fff;border-radius:99px;padding:11px 20px;font-weight:700;color:var(--chinh-dam);cursor:pointer;text-decoration:none}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.zoom{background:#5B9BE6;border-color:#5B9BE6;color:#fff;width:100%;padding:14px;font-size:16px}
.nut.nho2{padding:6px 14px;font-size:13px}
.nut:disabled{opacity:.5}
.dong-phu{font-size:13.5px;color:var(--nhat);margin:10px 0 0}
.dong-phu b{color:var(--muc)}
.qr{display:flex;gap:14px;align-items:center;margin-top:14px;font-size:13.5px}
.qr img{width:92px;height:92px;border-radius:10px;border:3px solid #fff;background:#fff;flex:none}
details.luu{margin-top:2px}
details.luu summary{cursor:pointer;font-weight:700;list-style:none}
details.luu summary::-webkit-details-marker{display:none}
details.luu summary::after{content:' ▾';color:var(--nhat)}
.luu-y{margin:10px 0 0;padding-left:20px;font-size:14px}.luu-y li{margin-bottom:6px}
/* bảng */
.loc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.loc button{border:1px solid var(--vien);background:#fff;border-radius:99px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.loc button.on{background:var(--muc);border-color:var(--muc);color:#fff}
.bang{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--vien);border-radius:14px;overflow:hidden;background:#fff}
.bang th{background:var(--p1);color:var(--p1c);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;font-weight:700}
.bang td{padding:11px 12px;border-top:1px solid var(--vien);vertical-align:top}
.bang tbody tr:nth-child(even) td{background:var(--hang)}
.bang tr.toi td{background:var(--p3)!important}
.bang tr.nghi td{color:var(--nhat)}
.so{font-weight:700;color:var(--chinh-dam)}
.bang td.ngay{white-space:nowrap}
.tt{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap;font-weight:700}
.tt.da{background:var(--p2);color:var(--p2c)}.tt.toi{background:var(--p3);color:var(--p3c)}.tt.sap{background:var(--p1);color:var(--p1c)}.tt.nghi{background:#EEE;color:#888}
.lk{color:var(--chinh-dam);font-weight:700;text-decoration:none;white-space:nowrap;display:inline-block;margin:0 8px 2px 0}
.ct{display:none}
.trong{color:var(--nhat);font-style:italic}
/* bài tập */
.bt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px dashed var(--vien);cursor:pointer}
.bt:first-of-type{border-top:0;padding-top:4px}
.bt input{width:22px;height:22px;accent-color:var(--p2c);margin-top:2px}
.bt p{margin:0;white-space:pre-line}.bt small{color:var(--nhat)}
.bt.xong p{text-decoration:line-through;color:var(--nhat)}
.bt .lks{margin-top:4px}
/* tài liệu */
.tim{width:100%;border:1px solid var(--vien);border-radius:99px;padding:10px 16px;background:#fff;margin-bottom:12px;font-size:16px}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tl a{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--vien);border-radius:16px;padding:14px;text-decoration:none;color:var(--muc);transition:transform .2s,box-shadow .2s;position:relative}
.tl a:hover{transform:translateY(-3px);box-shadow:0 12px 22px -14px rgba(0,0,0,.35)}
.tl i{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px}
.tl b{display:block;font-size:14.5px;line-height:1.35;padding-right:34px}.tl small{display:block;color:var(--nhat);font-size:12px}
.tl em{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;background:var(--p3);color:var(--p3c);border-radius:99px;padding:1px 8px;font-weight:700}
/* hồ sơ */
.thieu{color:var(--p3c);font-weight:700}.du{color:var(--p2c);font-weight:700}
.form{display:flex;flex-direction:column;gap:10px;margin-top:14px;background:#fff;border:1px solid var(--vien);border-radius:16px;padding:16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--nhat)}
.form input,.form textarea{border:1px solid var(--vien);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;color:var(--muc)}
/* vào lớp */
.vao{max-width:440px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:12px}
.vao img{width:70px;height:70px;border-radius:12px;margin:0 auto}
.vao input{text-align:center;font-size:24px;letter-spacing:.2em;text-transform:uppercase;padding:12px;border:2px solid var(--vien);border-radius:14px;background:#fff;width:100%}
.vao input:focus{outline:none;border-color:var(--chinh)}
.loi{color:#A8432F;font-size:14px;min-height:20px}
/* cài app */
.cai{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.cai img{width:42px;height:42px;border-radius:10px;flex:none}
.cai .x{margin-left:auto;border:0;background:transparent;font-size:20px;color:var(--nhat);cursor:pointer;padding:4px 8px}
.chan{text-align:center;color:var(--nhat);font-size:12px;margin-top:18px;letter-spacing:.08em}
.chan button{border:0;background:transparent;color:var(--chinh-dam);text-decoration:underline;cursor:pointer;font-size:12px}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--muc);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:20;transition:opacity .3s}
@media (max-width:760px){
  .khung{padding-bottom:110px}
  .ve-chu{padding:8px 11px}.ve-chu span{display:none}
  .dau{padding:14px}.dau .ten b{font-size:18px}.ct-trong{grid-template-columns:1fr}.mo-ct{font-size:13px}
  .o4{grid-template-columns:1fr 1fr;gap:10px}.o b{font-size:23px}
  .hai{grid-template-columns:1fr}
  .tab{position:fixed;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;margin:0;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
  .tab button{padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
  .tab button i{font-size:18px}
  .tab .dem{position:absolute;top:2px;left:50%;margin:0 0 0 8px}
  .an-dt{display:none}
  .bang{font-size:14px}.bang th,.bang td{padding:9px 8px}.bang th{letter-spacing:0;font-size:11px}
  .ct{display:table-row}.ct td{border-top:0!important;font-size:13px;color:var(--nhat);padding-top:0}
  .the{padding:16px}
}
@media (min-width:761px){.tab i{display:none}}
</style>
</head>
<body>
<div class="khung" id="khung"></div>
<script>
/* Trang học viên Guangyu Hanyu — đọc bản tóm tắt lớp qua hàm xem_lop (Supabase). Khoá công khai (publishable) an toàn để ở đây. */
const TRANG_CHU = 'https://guangyuhanyu.github.io/'; /* trang chủ của Thầy */
const SB_URL = 'https://tifzrefqfygavobfjysi.supabase.co', SB_KEY = 'sb_publishable_PS5aOpMFzG8tC25KC5yFMg_XZFV1uli';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'], THU_DAI = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
const s2d = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ngayISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const homNay = () => ngayISO(new Date());
const ngayVN = s => s ? s.split('-').reverse().join('/') : '';
const ngayNgan = s => s ? `${s.slice(8)}/${s.slice(5, 7)}` : '';
const thuNgay = s => s ? `${THU[s2d(s).getDay()]} · ${ngayNgan(s)}` : '';
const sachMa = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const tlChu = p => !p ? '' : p % 60 ? (p > 60 ? `${Math.floor(p / 60)}h${p % 60}` : `${p} phút`) : `${p / 60} tiếng`;
const gioChu = ph => { ph = Math.round(ph); const h = Math.floor(ph / 60), m = ph % 60; return [h ? h + ' tiếng' : '', m ? m + ' phút' : ''].filter(Boolean).join(' ') || '0 phút'; };
const gioNgan = ph => { ph = Math.round(ph); const h = Math.floor(ph / 60), m = ph % 60; return h ? h + 'h' + (m ? String(m).padStart(2, '0') : '') : m + ' phút'; };
/* lớp tính theo giờ: số buổi quy đổi × thời lượng chuẩn = số phút */
const luong = (k, n) => k.theo_gio ? gioChu(n * k.tl) : `${n} buổi`;
const luongNgan = (k, n) => k.theo_gio ? gioNgan(n * k.tl) : String(n);
const gioKet = (g, p) => { if (!g || !p) return ''; const [h, m] = g.split(':').map(Number), t = h * 60 + m + p; return `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const toast = t => { const n = document.createElement('div'); n.className = 'toast'; n.textContent = t; document.body.appendChild(n); setTimeout(() => { n.style.opacity = 0; setTimeout(() => n.remove(), 400); }, 2600); };
const lsDoc = (k, md) => { try { return JSON.parse(localStorage.getItem(k)) ?? md; } catch (e) { return md; } };
const lsGhi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
const LOAI_TL = { gt: ['📘', 'Giáo trình', 'p1'], audio: ['🎧', 'Audio', 'p2'], tv: ['🗂', 'Từ vựng', 'p3'], de: ['📝', 'Đề luyện', 'p4'], video: ['🎬', 'Video', 'p1'], khac: ['📎', 'Khác', 'p2'] };
const MAU_AV = ['p2', 'p1', 'p3', 'p4'];
const TEN_THIEU = { sdt: 'SĐT', email: 'Gmail', ngay_sinh: 'ngày sinh' };
const NHUNG = window.top !== window && new URLSearchParams(location.search).has('nhung'); /* đang mở trong lớp phủ của trang chủ */
const baoCha = m => { try { parent.postMessage({ gyLop: m }, location.origin); } catch (e) { } };
let D = null, MA = '', TAB = 'tq', LOC = 'all', LOC_TL = 'all', TIM = '', HS_CHON = null;

async function goiHam(ten, than) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${ten}`, { method: 'POST', headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(than) });
  if (!r.ok) { const e = new Error(await r.text()); e.status = r.status; throw e; }
  return r.json();
}

/* ---------- màn hình nhập mã ---------- */
function veVao(loi) {
  $('#khung').innerHTML = `<section class="the mat vao"><img src="logo.webp" alt="Guangyu Hanyu">
    <div><small class="mo" style="letter-spacing:.25em;font-size:11px">光余汉语 · GUANGYU HANYU</small><h2 style="justify-content:center;margin:6px 0 0">Tra cứu lớp học</h2></div>
    <p class="mo nho" style="margin:0">Nhập mã lớp Thầy gửi qua Zalo (8 ký tự).</p>
    <input id="o-ma" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" value="${esc(MA)}">
    <div class="loi">${loi || ''}</div>
    <button class="nut chinh" id="nut-vao">Xem lớp của tôi</button>${NHUNG ? '<button class="nut" data-dong-phu>✕ Đóng</button>' : `<a class="nut" href="${TRANG_CHU}">🏠 Về trang chủ</a>`}</section>`;
  baoCha('san');
  const o = $('#o-ma'); o.focus();
  o.addEventListener('input', () => { const v = sachMa(o.value).slice(0, 8); o.value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v; });
  o.addEventListener('keydown', e => { if (e.key === 'Enter') $('#nut-vao').click(); });
  $('#nut-vao').onclick = () => tai(sachMa(o.value));
}
async function tai(ma) {
  if (ma.length !== 8) return veVao('Mã gồm 8 ký tự, Thầy gửi trong tin nhắn Zalo.');
  if (!D) $('#khung').innerHTML = '<section class="the mat vao"><p class="mo">Đang tải lớp học…</p></section>';
  try {
    const d = await goiHam('xem_lop', { p_ma: ma });
    if (!d) { localStorage.removeItem('gy_ma_lop'); MA = ''; D = null; return veVao('Không tìm thấy lớp với mã này. Anh/chị/bạn kiểm tra lại hoặc nhắn Thầy nhé.'); }
    D = d; MA = ma; localStorage.setItem('gy_ma_lop', ma);
    history.replaceState(null, '', `?ma=${ma}${NHUNG ? '&nhung=1' : ''}`);
    document.title = `${d.lop} · Guangyu Hanyu`;
    ve();
  } catch (e) { if (!D) veVao('Chưa kết nối được. Anh/chị/bạn thử lại sau ít phút.'); }
}

/* ---------- dữ liệu dẫn xuất ---------- */
function chuanBi() {
  const d = D, hn = homNay(), bs = (d.buoi || []).slice().sort((a, b) => (a.ngay + (a.gio || '')).localeCompare(b.ngay + (b.gio || '')));
  let n = 0; bs.forEach(b => { b.so = b.tt === 'nghi' ? null : ++n; });
  const toi = bs.filter(b => b.tt === 'du_kien' && b.ngay >= hn);
  const tl = (d.tai_lieu || []).slice().sort((a, b) => (b.ngay || '').localeCompare(a.ngay || ''));
  const moiTu = ngayISO(new Date(Date.now() - 14 * 864e5));
  tl.forEach(t => { t.moi = (t.ngay || '') >= moiTu; });
  const tlBuoi = {}; tl.forEach(t => { if (t.buoi) (tlBuoi[t.buoi] = tlBuoi[t.buoi] || []).push(t); });
  bs.forEach(b => { b.tls = tlBuoi[b.id] || (b.tl || []).map(id => tl.find(t => t.id === id)).filter(Boolean); });
  const bt = bs.filter(b => b.bt && b.tt !== 'nghi').reverse();
  return { bs, toi, tl, bt, hn };
}
